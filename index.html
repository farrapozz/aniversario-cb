<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para você 🐸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 50% 40%, #234d3c 0%, #10251e 45%, #07110e 100%);

            color: #f2f7f3;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        .container {
            width: min(90%, 600px);
            text-align: center;
            padding: 40px 25px;
        }

        .frog {
            font-size: 80px;
            margin-bottom: 30px;

            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(32px, 7vw, 52px);
            font-weight: normal;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.7;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        button {
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.08);
            color: white;

            padding: 15px 35px;
            border-radius: 40px;

            font-size: 16px;
            font-family: inherit;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-3px);
        }

        .hidden {
            display: none;
        }

        .message {
            animation: appear 1s ease forwards;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="frog">🐸</div>

        <section id="inicio">

            <h1>Oi, Bel.</h1>

            <p class="subtitle">
                Tem uma coisinha aqui esperando por você.
            </p>

            <button onclick="abrirSurpresa()">
                entrar
            </button>

        </section>


        <section id="surpresa" class="hidden">

            <h1>Você encontrou. 💚</h1>

            <p class="subtitle">
                Mas isso aqui ainda está só começando...
            </p>

        </section>

    </main>


    <script>

        function abrirSurpresa() {

            document.getElementById("inicio").classList.add("hidden");

            document.getElementById("surpresa").classList.remove("hidden");

        }

    </script>

</body>
</html>
